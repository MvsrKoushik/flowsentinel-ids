[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsentinel-ids"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flowsentinel = "flowsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
